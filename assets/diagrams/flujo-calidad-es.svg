<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-label="Flujo de calidad antes de construir" font-family="Inter,'Segoe UI',system-ui,sans-serif"><title>Flujo de calidad antes de construir</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52606d"/></marker></defs><rect width="1000" height="445" fill="#ffffff"/><text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1f2e">Flujo de calidad antes de construir</text>
